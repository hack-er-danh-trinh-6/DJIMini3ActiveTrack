plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dji.mini3activetrack'
    compileSdk ANDROID_COMPILE_SDK_VERSION.toInteger()

    defaultConfig {
        applicationId "com.dji.mini3activetrack"
        minSdk ANDROID_MIN_SDK_VERSION.toInteger()
        targetSdk ANDROID_TARGET_SDK_VERSION.toInteger()
        versionCode 1
        versionName "1.0.0"

        // DJI API Key from gradle.properties
        manifestPlaceholders["API_KEY"] = project.AIRCRAFT_API_KEY

        ndk {
            // DJI MSDK v5 supports these ABIs
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Enable multidex for large apps
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Packaging options to handle duplicate files from DJI SDK
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni.so"
        doNotStrip "*/*/libsfjni.so"
        doNotStrip "*/*/libDJICommonJNI.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core.so"
        doNotStrip "*/*/libAMapSDK_MAP_v6_9_2.so"
        doNotStrip "*/*/libDJIMOP.so"
        doNotStrip "*/*/libDJISDKLOGJNI.so"
        exclude 'META-INF/rxjava.properties'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ============================================================
    // DJI Mobile SDK V5 - Aircraft Package
    // ============================================================
    // Main SDK package for aircraft control
    implementation 'com.dji:dji-sdk-v5-aircraft:5.9.0'
    // Compilation-only package (interfaces/APIs)
    compileOnly 'com.dji:dji-sdk-v5-aircraft-provided:5.9.0'
    // Network library for MSDK (required for cloud features)
    runtimeOnly 'com.dji:dji-sdk-v5-networkImp:5.9.0'

    // ============================================================
    // OpenCV Android SDK (for object tracking - CSRT/KCF tracker)
    // ============================================================
    // Using OpenCV 4.8.0 via Maven
    implementation 'com.quickbirdstudios:opencv:4.5.3.0'

    // ============================================================
    // MediaPipe (for object detection and pose estimation)
    // ============================================================
    implementation 'com.google.mediapipe:tasks-vision:0.10.8'

    // ============================================================
    // Camera & Video Processing
    // ============================================================
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ============================================================
    // UI Components
    // ============================================================
    // Lottie for animations
    implementation 'com.airbnb.android:lottie:6.3.0'
    // CircleImageView for profile/status indicators
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // ============================================================
    // Utilities
    // ============================================================
    // Timber for logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
