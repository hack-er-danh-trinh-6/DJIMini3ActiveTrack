org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true

# Android SDK versions
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=34
ANDROID_COMPILE_SDK_VERSION=34
KOTLIN_VERSION=1.9.0

# DJI SDK API Key - Replace with your actual key from developer.dji.com
# Register your app at: https://developer.dji.com/user/apps/#all
AIRCRAFT_API_KEY=YOUR_DJI_API_KEY_HERE
android.experimental.suppressExtractNativeLibsWarnings=true
android.suppressUnsupportedCompileSdk=34
